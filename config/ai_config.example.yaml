# AI Provider Configuration
# Copy this to ai_config.yaml and fill in your settings

providers:
  openai:
    enabled: true
    models:
      - name: "gpt-4-turbo"
        max_tokens: 128000
        supports_json: true
        cost_per_1k_tokens:
          input: 0.01
          output: 0.03
      - name: "gpt-4"
        max_tokens: 8192
        supports_json: true
        cost_per_1k_tokens:
          input: 0.03
          output: 0.06
      - name: "gpt-3.5-turbo"
        max_tokens: 16385
        supports_json: true
        cost_per_1k_tokens:
          input: 0.0005
          output: 0.0015
    default_model: "gpt-4-turbo"
    temperature: 0.7
    timeout: 60

  anthropic:
    enabled: true
    models:
      - name: "claude-3-opus-20240229"
        max_tokens: 200000
        supports_json: true
        cost_per_1k_tokens:
          input: 0.015
          output: 0.075
      - name: "claude-3-sonnet-20240229"
        max_tokens: 200000
        supports_json: true
        cost_per_1k_tokens:
          input: 0.003
          output: 0.015
      - name: "claude-3-haiku-20240307"
        max_tokens: 200000
        supports_json: true
        cost_per_1k_tokens:
          input: 0.00025
          output: 0.00125
    default_model: "claude-3-sonnet-20240229"
    temperature: 0.7
    timeout: 60

  openrouter:
    enabled: true
    base_url: "https://openrouter.ai/api/v1"
    models:
      - name: "anthropic/claude-3-opus"
        max_tokens: 200000
        supports_json: true
        cost_per_1k_tokens:
          input: 0.015
          output: 0.075
      - name: "anthropic/claude-3-sonnet"
        max_tokens: 200000
        supports_json: true
        cost_per_1k_tokens:
          input: 0.003
          output: 0.015
      - name: "openai/gpt-4-turbo"
        max_tokens: 128000
        supports_json: true
        cost_per_1k_tokens:
          input: 0.01
          output: 0.03
      - name: "openai/gpt-3.5-turbo"
        max_tokens: 16385
        supports_json: true
        cost_per_1k_tokens:
          input: 0.0005
          output: 0.0015
      - name: "google/gemini-pro"
        max_tokens: 32768
        supports_json: true
        cost_per_1k_tokens:
          input: 0.000125
          output: 0.000375
      - name: "meta-llama/llama-3-70b-instruct"
        max_tokens: 8192
        supports_json: false
        cost_per_1k_tokens:
          input: 0.00059
          output: 0.00079
    default_model: "anthropic/claude-3-sonnet"
    temperature: 0.7
    timeout: 60
    # Optional: Your site URL and app name for OpenRouter rankings
    site_url: "https://github.com/FatStinkyPanda/Readme_Tools"
    app_name: "README Tools"

  ollama:
    enabled: false
    base_url: "http://localhost:11434"
    models:
      - name: "llama2"
        max_tokens: 4096
        supports_json: false
      - name: "mistral"
        max_tokens: 8192
        supports_json: false
      - name: "codellama"
        max_tokens: 16384
        supports_json: false
    default_model: "llama2"
    temperature: 0.7
    timeout: 120

# Categorization Settings
categorization:
  # Categories to look for when parsing README
  default_categories:
    - installation
    - configuration
    - usage
    - api
    - development
    - testing
    - deployment
    - troubleshooting
    - contributing
    - license

  # Custom category detection prompts
  prompts:
    categorize: |
      Analyze the following README section and determine its category.
      Consider the content, headings, and context.

      Available categories: {categories}

      Section:
      {content}

      Respond with JSON: {{"category": "category_name", "confidence": 0.0-1.0, "reasoning": "brief explanation"}}

    extract_keywords: |
      Extract relevant keywords from this README section.
      Focus on technical terms, concepts, and important phrases.

      Section:
      {content}

      Respond with JSON: {{"keywords": ["keyword1", "keyword2", ...], "importance": {{"keyword1": 0.0-1.0, ...}}}}

    generate_tags: |
      Generate descriptive tags for this README section.
      Tags should be short, relevant, and helpful for search.

      Section:
      {content}

      Respond with JSON: {{"tags": ["tag1", "tag2", ...]}}

    summarize: |
      Create a brief summary of this README section (2-3 sentences).
      Focus on the main purpose and key information.

      Section:
      {content}

      Respond with: A concise summary.

# Indexing Settings
indexing:
  # Minimum word length for indexing
  min_word_length: 3

  # Maximum keyword weight
  max_keyword_weight: 1.0

  # Stopwords to exclude from indexing
  use_nltk_stopwords: true
  custom_stopwords:
    - "etc"
    - "ie"
    - "eg"

# Search Settings
search:
  # Default result limit
  default_limit: 10

  # Maximum results to return
  max_limit: 100

  # Snippet length for search results
  snippet_length: 200

  # Context before/after match in snippet
  snippet_context: 50

  # Relevance scoring weights
  scoring:
    title_match: 2.0
    keyword_match: 1.5
    tag_match: 1.3
    content_match: 1.0
    category_match: 1.2

# Context Provider Settings
context_provider:
  # Default token limit for AI agents
  default_max_tokens: 4000

  # Maximum tokens allowed
  max_tokens: 8000

  # Include related sections
  include_related: true

  # Maximum related sections
  max_related: 3

  # Minimum relevance score for inclusion
  min_relevance_score: 0.3
